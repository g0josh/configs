#Terminal admin:
#-------------------------------------------------------#

set -g default-terminal "tmux-256color" #256 colours

set -g base-index 1 # start with window 1 (instead of 0)

set -g pane-base-index 1 # start with pane 1

set -g renumber-windows on # renumber all windows when any window is closed 
 
# use vi mode
setw -g mode-keys vi
set -g status-keys vi
unbind [
bind Escape copy-mode
 
#setw -g utf8 on # allow utf8 support

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

bind r source-file ~/.config/tmux/tmux.conf # reload config file

# remap prefix from 'C-b'
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# scrollback buffer size
set -g history-limit 100000
#-------------------------------------------------------#
#PANE NAVIGATION/MANAGEMENT

# split panes
bind '\' split-window -h
bind - split-window -v
unbind '"'
unbind %


# switch panes using Alt-arrow without prefix
bind -n C-h select-pane -L
bind -n C-l select-pane -R
bind -n C-k select-pane -U
bind -n C-j select-pane -D

#Resizing panes:
bind -r j resize-pane -D 2
bind -r k resize-pane -U 2
bind -r h resize-pane -L 2
bind -r l resize-pane -R 2

# vi mode keys --------------------------------------------------
# Bind 'y' to copy to system clipboard and exit copy mode
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
# Bind 'v' for visual selection (similar to Vim's visual mode)
bind-key -T copy-mode-vi v send-keys -X begin-selection
# Optional: For mouse selection, release to copy to system clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Optional: Copy the entire line with 'Y' (Shift+y), similar to Vim's Y
bind-key -T copy-mode-vi Y send-keys -X copy-line-and-cancel "pbcopy"

# Scroll up/down by 1 line, half screen, whole screen
bind -T copy-mode-vi C-Up              send-keys -X scroll-up
bind -T copy-mode-vi C-Down            send-keys -X scroll-down
bind -T copy-mode-vi C-PageUp          send-keys -X halfpage-up
bind -T copy-mode-vi C-PageDown        send-keys -X halfpage-down
bind -T copy-mode-vi PageDown          send-keys -X page-down
bind -T copy-mode-vi PageUp            send-keys -X page-u
#-------------------------------------------------------#
# Windows
unbind n
unbind S
unbind s
unbind W
unbind w
bind-key n new-window
bind-key s command-prompt -p "New session name:" "new-session; rename-session '%%'"
bind-key S command-prompt -p "Rename session:" "rename-session '%%'"
bind-key w command-prompt -p "New window name:" "new-window; rename-window '%%'"
bind-key W command-prompt -p "Rename window:" "rename-window '%%'"
bind-key c clear-history

bind-key -n C-] next-window
bind-key -n C-[ previous-window
bind-key -r ] next-window
bind-key -r [ previous-window
bind-key -r '}' swap-window -d -t +1
bind-key -r '{' swap-window -d -t -1

bind t choose-tree s
bind d detach
bind -n C-x kill-pane
bind -n C-w kill-window
bind -n C-q kill-session
bind q kill-session


set -g @plugin 'tmux-plugins/tpm'

# Status line---------------------------------------------------------------------
set -g @plugin 'catppuccin/tmux'

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_background "#242638" 
set -g @catppuccin_window_current_text " #{b:window_name}"
set -g @catppuccin_window_text " #{b:window_name}"
#
# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set-window-option -g status-position bottom

run '~/.config/tmux/plugins/tpm/tpm'

